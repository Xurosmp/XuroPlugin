      - {type: ITEM, material: NETHERITE_INGOT, amount: 4, chance: 15}
      - {type: ITEM, material: ENCHANTED_GOLDEN_APPLE, amount: 4, chance: 15}
      - {type: ITEM, material: ELYTRA, amount: 1, chance: 4}
      - {type: ITEM, material: TOTEM_OF_UNDYING, amount: 3, chance: 10}
      - {type: COMMAND, command: "give %player% nether_star 1", icon: NETHER_STAR, name: "<light_purple>Nether Star", chance: 0.5}

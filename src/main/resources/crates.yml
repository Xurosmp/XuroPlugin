# Crates. chance = Gewichtung (relativ zueinander).
# Reward-Typen: ITEM (material, amount, optional name) | MONEY (amount) | CRYSTALS (amount) | COMMAND (command, icon, name)
# Platzieren: Block anschauen -> /crate set <id>.  Linksklick = Vorschau, Rechtsklick = öffnen.
crates:
  common:
    name: "<green><bold>Common Crate"
    key-name: "<green>Common Key"
    icon: CHEST
    rewards:
      - {type: MONEY, amount: 2500, chance: 30}
      - {type: MONEY, amount: 10000, chance: 12}
      - {type: CRYSTALS, amount: 2, chance: 20}
      - {type: ITEM, material: IRON_INGOT, amount: 32, chance: 15}
      - {type: ITEM, material: COOKED_BEEF, amount: 32, chance: 15}
      - {type: ITEM, material: DIAMOND, amount: 4, chance: 7}
      - {type: CRYSTALS, amount: 10, chance: 1}
  rare:
    name: "<aqua><bold>Rare Crate"
    key-name: "<aqua>Rare Key"
    icon: ENDER_CHEST
    rewards:
      - {type: MONEY, amount: 25000, chance: 28}
      - {type: MONEY, amount: 100000, chance: 8}
      - {type: CRYSTALS, amount: 8, chance: 20}
      - {type: ITEM, material: DIAMOND, amount: 16, chance: 18}
      - {type: ITEM, material: GOLDEN_APPLE, amount: 8, chance: 15}
      - {type: ITEM, material: NETHERITE_SCRAP, amount: 4, chance: 8}
